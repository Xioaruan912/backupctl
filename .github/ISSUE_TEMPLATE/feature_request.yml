name: 功能建议
description: 提出一个想法或改进
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Backup Manager 有意把数据安全放在便利性之前，并避免重量依赖，
        请在设计方案时考虑这一点。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能能解决什么问题？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你希望它如何工作？可以附上 CLI 或配置示例。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 范围检查
      options:
        - label: 可以用纯 Bash 实现，且不引入新的重量依赖
          required: true
        - label: 不会削弱数据安全保证
          required: true
